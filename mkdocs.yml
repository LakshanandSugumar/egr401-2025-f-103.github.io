site_name: Team 20 · Solar Tracker Tilt Sensing
site_description: A sub-$10 tilt sensor for solar tracker rows that needs no power on the follower row. EGR 401/402 Senior Capstone, ASU Polytechnic.
site_url: https://lakshanandsugumar.github.io/egr401-2025-f-103.github.io/
repo_url: https://github.com/LakshanandSugumar/egr401-2025-f-103.github.io
repo_name: Team 20 site source
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: custom_theme/
  logo: static/logo.svg
  favicon: static/logo.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - content.tabs.link

nav:
  - Home: index.md
  - The Problem: problem.md
  - Our Solution: solution.md
  - Design Decisions: decisions.md
  - Technology: technology.md
  - Budget & Unit Cost: budget.md
  - Milestones: milestones.md
  - Team: team.md
  - Status: status.md
  - Camera Concept:
    - camera-concept/index.md
    - Field Simulation: camera-concept/simulation.md
    - Results: camera-concept/results.md
    - Cost Under $10: camera-concept/cost.md
    - Gazebo Model: camera-concept/gazebo.md

markdown_extensions:
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tilde: {}
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

draft_docs: |
  **/*_unpublished.md
  **/*_draft.md

plugins:
  - search
  - glightbox

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

not_in_nav: |
  static

copyright: "Copyright &copy; 2026 Team 20 · Arizona State University, Polytechnic · Built by Lakshanand Sugumar"

extra:
  generator: false
